name: Build and SEO/GEO check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: also check that outbound links (coauthors, journals) still work.
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: SEO/GEO check
        run: npm run seo:check ${{ github.event_name == 'schedule' && '-- --external' || '' }}
